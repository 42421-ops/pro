<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SGX Detailing</title>
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGX">
<meta name="description" content="SGX Detailing — студия автомойки и детейлинга">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg-color:#0b0c10; --card-bg:#16181e; --card-bg-2:#1f222a;
  --text:#fff; --muted:#8e95a5; --line:rgba(255,255,255,.07);
  --accent-color:#2563eb; --accent-2:#3b82f6; --accent-glow:rgba(59,130,246,.45); --accent-soft:rgba(59,130,246,.14);
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg-color);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,sans-serif;overscroll-behavior:none}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card-bg-2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=date],input[type=time]{color-scheme:dark}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;letter-spacing:.3px}
svg{display:block}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding:calc(var(--safe-t) + 14px) 16px calc(110px + var(--safe-b));
  background:radial-gradient(520px 320px at 85% -40px,var(--accent-soft),transparent 70%)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:2px}
.logo img{height:34px;max-width:120px;object-fit:contain;border-radius:8px}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 12px var(--accent-glow)}
.seg{display:flex;background:var(--card-bg);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.25s}
.seg button.on{background:var(--accent-color);color:#fff;box-shadow:0 0 16px var(--accent-glow)}

.card{background:var(--card-bg);border-radius:22px;border:1px solid var(--line);padding:16px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,var(--card-bg-2),var(--card-bg));border:1px solid var(--line);min-height:330px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,16,.05) 20%,rgba(11,12,16,.92) 82%)}
.hero .art{position:absolute;left:0;right:0;top:0;height:60%;display:flex;align-items:center;justify-content:center}
.hero .art::before{content:"";position:absolute;width:75%;height:70%;border-radius:50%;background:var(--accent-color);filter:blur(60px);opacity:.45}
.hero .art svg{position:relative;width:88%;filter:drop-shadow(0 0 14px var(--accent-glow))}
.hero .body{position:relative;padding:20px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hero p{color:#c3c8d4;font-size:14px;line-height:1.45;margin:6px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:16px;font-weight:700;font-size:15px;background:var(--accent-color);color:#fff;box-shadow:0 6px 24px var(--accent-glow);transition:transform .15s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.block{width:100%}
.btn.ghost{background:var(--card-bg-2);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:rgba(239,68,68,.14);color:#ff7b7b;box-shadow:none}
.btn.small{padding:9px 14px;font-size:13px;border-radius:12px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:14px 12px}
.stat .ic{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}

.promo{background:linear-gradient(135deg,var(--accent-color),var(--accent-2) 120%);border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:0 10px 36px var(--accent-glow)}
.promo::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.promo small{opacity:.8;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.promo h3{font-size:22px;margin:6px 0 6px;position:relative}
.promo p{font-size:14px;opacity:.9;margin-bottom:14px;position:relative}
.promo .btn{background:#fff;color:#0b0c10;box-shadow:none;position:relative}

h2.sec{font-size:19px;margin:24px 2px 12px;display:flex;align-items:center;justify-content:space-between}
h2.sec small{font-size:13px;color:var(--muted);font-weight:500}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll img{height:150px;width:210px;object-fit:cover;border-radius:18px;flex:none;scroll-snap-align:start;border:1px solid var(--line)}

.svc{display:flex;gap:14px;align-items:center;padding:16px;margin-bottom:10px;background:var(--card-bg);border:1px solid var(--line);border-radius:22px;cursor:pointer;transition:.2s}
.svc:active{transform:scale(.985)}
.svc .meta{flex:1;min-width:0}
.svc h4{font-size:16px}
.svc p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.svc .tags{display:flex;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.svc .price{font-weight:800;font-size:16px;color:var(--text);white-space:nowrap}
.svc .go{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card-bg-2);color:var(--muted)}
.pill.confirmed{background:var(--accent-soft);color:var(--accent-2)}
.pill.work{background:rgba(245,158,11,.14);color:var(--warn)}
.pill.done{background:rgba(34,197,94,.14);color:var(--ok)}
.pill.cancelled{background:rgba(239,68,68,.14);color:var(--danger)}

.rows .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows .row:last-child{border:0}
.rows .row span:first-child{color:var(--muted)}
.rows .row span:last-child{text-align:right;font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:22px;background:var(--card-bg);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--accent-2)}

/* Bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));width:min(calc(100% - 32px),440px);display:flex;padding:6px;border-radius:26px;
  background:rgba(22,24,30,.62);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);transition:.25s}
.nav button.on{color:var(--accent-2);background:var(--accent-soft)}
.nav button.on svg{filter:drop-shadow(0 0 6px var(--accent-glow))}

/* Admin */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .nb{width:40px;height:40px;border-radius:13px;background:var(--card-bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.datebar .dt{flex:1;text-align:center;font-weight:700;font-size:15px;line-height:1.2}
.datebar .dt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.metric{background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:14px 12px}
.metric span{font-size:12px;color:var(--muted)}
.metric b{display:block;font-size:22px;margin-top:6px}
.metric.acc b{color:var(--accent-2)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--card-bg);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:left;transition:.2s}
.qa button:active{transform:scale(.97)}
.qa button .i{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;flex:none}
.qa button.main{grid-column:1/-1;background:var(--accent-color);border:0;justify-content:center;font-size:16px;padding:16px;box-shadow:0 8px 28px var(--accent-glow)}
.qa button.main .i{background:rgba(255,255,255,.2);color:#fff}
.bk{display:flex;gap:12px;padding:14px;margin-bottom:10px;background:var(--card-bg);border:1px solid var(--line);border-radius:20px;cursor:pointer}
.bk .tm{min-width:58px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.bk .tm b{display:block;font-size:17px}
.bk .tm span{font-size:11px;color:var(--muted)}
.bk .inf{flex:1;min-width:0}
.bk .inf h5{font-size:15px;margin-bottom:2px}
.bk .inf p{font-size:12.5px;color:var(--muted);line-height:1.4}
.bk .sum{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:700;font-size:14px}
.dayhead{font-size:13px;color:var(--muted);margin:16px 4px 8px;font-weight:600;text-transform:capitalize}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:ov .25s}
@keyframes ov{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;max-height:92vh;background:var(--card-bg);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.sheet .sh h3{font-size:19px}
.sheet .x{width:34px;height:34px;border-radius:50%;background:var(--card-bg-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sheet .sb{padding:4px 20px calc(24px + var(--safe-b));overflow-y:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:58px;padding:10px 8px;border-radius:16px;background:var(--card-bg-2);border:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted);transition:.2s}
.chip b{display:block;font-size:17px;color:var(--text);margin-top:2px}
.chip.on{background:var(--accent-color);color:#fff;border-color:transparent;box-shadow:0 4px 18px var(--accent-glow)}
.chip.on b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:11px 0;border-radius:13px;background:var(--card-bg-2);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.2s}
.slot.on{background:var(--accent-color);border-color:transparent;box-shadow:0 4px 16px var(--accent-glow)}
.slot:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card-bg-2);border:1.5px solid transparent;margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--accent-2);background:var(--accent-soft)}
.opt .n{flex:1;font-weight:600;font-size:14px}
.opt .n small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:grid;gap:10px}
.sw{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card-bg-2);border:1.5px solid transparent;text-align:left;width:100%}
.sw.on{border-color:var(--sc)}
.sw i{width:34px;height:34px;border-radius:50%;background:var(--sc);box-shadow:0 0 18px var(--sc);flex:none}
.sw span{flex:1;font-weight:600}
.edit{background:var(--card-bg-2);border-radius:18px;padding:12px;margin-bottom:10px}
.edit input{margin-bottom:8px;background:var(--card-bg)}
.imgprev{width:100%;height:150px;border-radius:16px;background:var(--card-bg-2) center/cover;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.gal div{position:relative;aspect-ratio:1;border-radius:14px;background:center/cover}
.gal button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:14px}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-90px);background:var(--card-bg-2);border:1px solid var(--line);padding:12px 18px;border-radius:16px;z-index:99;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.toast.show{transform:translate(-50%,0)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.contacts a{color:var(--accent-2);text-decoration:none}
.lockbtn{width:38px;height:38px;border-radius:12px;color:var(--muted);opacity:.5;display:flex;align-items:center;justify-content:center}.lockbtn:active{opacity:1}
.logo{min-width:0}.logo span.t{white-space:nowrap}
.qa button.wide{grid-column:1/-1;justify-content:center;padding:18px;font-size:16px}.qa button.wide .i{width:38px;height:38px}
.sc{background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.sc a{color:var(--accent-2);text-decoration:none}
.sc.work{border-color:var(--accent-2);box-shadow:0 0 18px var(--accent-soft)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding:10px 4px 22px;background:var(--card-bg-2);border-radius:18px}
.bars .b{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;min-width:0}
.bars .b i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--accent-2),var(--accent-color));box-shadow:0 0 10px var(--accent-glow)}
.bars .b span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast"></div>

/* ============ HELPERS ============ */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function mon(s){const d=pd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
const MS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WDF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function fdate(s){const d=pd(s);return d.getDate()+' '+MS[d.getMonth()]}
function fdateL(s){const d=pd(s);return WDF[d.getDay()]+', '+d.getDate()+' '+MS[d.getMonth()]}
const tm=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const mt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const rub=n=>Number(n).toLocaleString('ru-RU').replace(/\u00A0/g,' ')+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function readImg(file,max=1000){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}
function pickImg(max){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){try{res(await readImg(i.files[0],max))}catch(e){toast('Не удалось прочитать фото')}}};i.click()})}

/* ============ AVAILABILITY ============ */
function slotsFor(date,sid,ignoreId){
  const sv=svc(sid);if(!sv)return[];
  const o=tm(S.settings.open),c=tm(S.settings.close),step=Math.max(15,+S.settings.slot||60),out=[];
  const act=S.bookings.filter(b=>b.date===date&&b.status!=='cancelled'&&b.id!==ignoreId);
  const now=new Date(),today=iso(now),nowM=now.getHours()*60+now.getMinutes();
  for(let t=o;t+sv.dur<=c;t+=step){
    const ov=act.filter(b=>t<tm(b.time)+b.dur&&t+sv.dur>tm(b.time));
    const pts=[t,...ov.map(b=>tm(b.time)).filter(x=>x>t&&x<t+sv.dur)];
    const peak=Math.max(...pts.map(pt=>ov.filter(b=>tm(b.time)<=pt&&pt<tm(b.time)+b.dur).length));
    const past=date<today||(date===today&&t<=nowM);
    out.push({t:mt(t),free:!past&&peak<Math.max(1,+S.settings.boxes||1)});
  }
  return out;
}

const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let SU={view:'month',date:iso(new Date())};
function statsHtml(){
  const d=pd(SU.date),y=d.getFullYear(),m=d.getMonth(),p2=n=>String(n).padStart(2,'0');
  let all,bars,label;
  if(SU.view==='month'){
    const pre=y+'-'+p2(m+1);all=S.bookings.filter(b=>b.date.startsWith(pre));label=MN[m]+' '+y;
    bars=Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>({l:(i+1)%5===0||i===0?String(i+1):'',v:all.filter(b=>b.date===pre+'-'+p2(i+1)&&b.status==='done').reduce((s,b)=>s+b.price,0)}));
  }else{
    all=S.bookings.filter(b=>b.date.startsWith(y+'-'));label=y+' год';
    bars=MN.map((n,i)=>({l:n.slice(0,3),v:all.filter(b=>b.date.startsWith(y+'-'+p2(i+1))&&b.status==='done').reduce((s,b)=>s+b.price,0)}));
  }
  const live=all.filter(b=>b.status!=='cancelled'),done=live.filter(b=>b.status==='done'),canc=all.filter(b=>b.status==='cancelled');
  const rev=done.reduce((s,b)=>s+b.price,0),pend=live.filter(b=>b.status!=='done').reduce((s,b)=>s+b.price,0);
  const avg=done.length?Math.round(rev/done.length):0,max=Math.max(1,...bars.map(b=>b.v));
  const top={};live.forEach(b=>{const t=top[b.sname]||(top[b.sname]={n:0,r:0});t.n++;if(b.status==='done')t.r+=b.price});
  const tl=Object.entries(top).sort((a,b)=>b[1].n-a[1].n).slice(0,5);
  return `<div class="seg" style="margin-bottom:12px"><button style="flex:1" data-act="stat-view" data-v="month" class="${SU.view==='month'?'on':''}">Месяц</button><button style="flex:1" data-act="stat-view" data-v="year" class="${SU.view==='year'?'on':''}">Год</button></div>
  <div class="datebar"><button class="nb" data-act="stat-shift" data-v="-1">${I.chevL}</button><div class="dt">${label}</div><button class="nb" data-act="stat-shift" data-v="1">${I.chevR}</button></div>
  <div class="metrics" style="margin-top:4px"><div class="metric"><span>Заезды</span><b>${live.length}</b></div><div class="metric"><span>Выполнено</span><b>${done.length}</b></div><div class="metric"><span>Отмены</span><b>${canc.length}</b></div></div>
  <div class="grid2" style="margin-bottom:14px"><div class="metric acc"><span>Получено</span><b style="font-size:18px">${rub(rev)}</b></div><div class="metric"><span>Средний чек</span><b style="font-size:18px">${rub(avg)}</b></div></div>
  <div class="metric" style="margin-bottom:14px"><span>Ожидается (запланировано)</span><b style="font-size:18px">${rub(pend)}</b></div>
  <label class="f">Выручка по ${SU.view==='month'?'дням':'месяцам'}</label>
  <div class="bars">${bars.map(b=>`<div class="b"><i style="height:${Math.max(b.v?4:1,b.v/max*100)}%" title="${rub(b.v)}"></i><span>${b.l}</span></div>`).join('')}</div>
  <label class="f" style="margin-top:18px">Популярные услуги</label>
  ${tl.length?`<div class="card rows" style="background:var(--card-bg-2)">${tl.map(([n,t])=>`<div class="row"><span style="color:var(--text)">${esc(n)}</span><span>${t.n} · ${rub(t.r)}</span></div>`).join('')}</div>`:'<p class="hint">За выбранный период записей нет.</p>'}`;
}

function ask(msg,okLabel){

    o.innerHTML=`<div class="card" style="width:calc(100% - 40px);max-width:360px;padding:22px;text-align:center;border-radius:24px;animation:fade .25s"><p style="font-size:16px;font-weight:600;margin-bottom:18px;line-height:1.4">${esc(msg)}</p><div class="grid2"><button class="btn ghost" data-k="0">Отмена</button><button class="btn" data-k="1">${esc(okLabel||'Да')}</button></div></div>`;
    o.addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k||e.target===o){o.remove();res(!!k&&k.dataset.k==='1')}});
    document.body.appendChild(o);
  });
}

function staffSorted(){return [...S.staff].sort((a,b)=>(b.common?1:0)-(a.common?1:0))}
function staffLoginHtml(){
  if(!S.staff.length)return '<div class="empty" style="padding:20px 0">Сотрудники не добавлены.<br>Администратор может добавить их в разделе «Сотрудники».</div>';
  if(!S.staff.find(x=>x.id===STP))STP=staffSorted()[0].id;
  return `<label class="f">Сотрудник</label><div class="chips" style="flex-wrap:wrap;overflow:visible">${staffSorted().map(x=>`<button class="chip ${x.id===STP?'on':''}" style="padding:12px 16px" data-act="stf-pick" data-id="${x.id}"><b style="font-size:15px;margin:0">${esc(x.name)}</b>${x.common?'<small>общий для всех</small>':''}</button>`).join('')}</div>
  <label class="f">PIN-код</label><input id="sp0" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <button class="btn block" style="margin-top:16px" data-act="stf-login">Войти</button>`;

function askStaff(){LR='staff';askLogin()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sp0')document.querySelector('[data-act=stf-login]').click()});
function stfLogin(){
  const m=S.staff.find(x=>x.id===STP);if(!m)return;
  if(val('sp0')!==String(m.pin)){toast('Неверный PIN');const i=document.getElementById('sp0');i.value='';i.focus();return}
  setStaff(m.id);setAuth(false);UI.mode='staff';localStorage.setItem('sgx_mode','staff');
  closeSheet();window.scrollTo(0,0);render();toast('Здравствуйте, '+m.name);
}
async function stfStatus(id,v){
  const me=curStaff();if(!me)return;
  const b=S.bookings.find(x=>x.id===id);if(!b)return;
  const ok=(b.status==='confirmed'&&(v==='work'||v==='done'))||(b.status==='work'&&v==='done')||(b.status==='done'&&v==='work'&&b.doneById===me.id);
  if(!ok)return toast('Это действие недоступно');
  if(v==='done'&&!await ask('Закрыть заказ как выполненный?','Выполнено'))return;
  setStatus(id,v,{id:me.id,name:me.name});render();toast(v==='done'?'Заказ закрыт':'Заказ принят в работу');
}
function staffCard(b,me){
  const hm=t=>new Date(t).toTimeString().slice(0,5);
  const act=b.status==='confirmed'
    ?`<div class="grid2"><button class="btn ghost" data-act="stf-status" data-id="${b.id}" data-v="work">В работу</button><button class="btn" data-act="stf-status" data-id="${b.id}" data-v="done">✓ Выполнено</button></div>`
    :b.status==='work'
    ?`<button class="btn block" data-act="stf-status" data-id="${b.id}" data-v="done">✓ Заказ выполнен</button>`
    :`<p class="hint" style="margin:0">Закрыл: ${esc(b.doneBy||'—')}${b.doneAt?' · '+hm(b.doneAt):''}</p>${b.doneById===me.id?`<button class="btn ghost small" style="margin-top:8px" data-act="stf-status" data-id="${b.id}" data-v="work">Вернуть в работу</button>`:''}`;
  const tel=esc((b.phone||'').replace(/[^+\d]/g,''));
  return `<div class="sc ${b.status==='work'?'work':''}"><div class="bk" style="padding:0;margin:0;border:0;background:none;cursor:default"><div class="tm"><b>${b.time}</b><span>${b.dur} мин</span></div><div class="inf"><h5>${esc(b.sname)}</h5><p>${esc(b.name)} · <a href="tel:${tel}">${esc(b.phone)}</a><br>${esc(b.car)}${b.plate?' · '+esc(b.plate):''}</p></div><div class="sum"><span>${rub(b.price)}</span><span class="pill ${b.status}">${ST[b.status]}</span></div></div><div style="margin-top:12px">${act}</div></div>`;
}
function staffView(){
  const me=curStaff(),d=UI.sDate;
  const list=S.bookings.filter(b=>b.date===d&&b.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));
  const w=list.filter(b=>b.status==='work'),c=list.filter(b=>b.status==='confirmed'),dn=list.filter(b=>b.status==='done');
  const grp=(t,arr)=>arr.length?`<h2 class="sec">${t} <small>${arr.length}</small></h2>${arr.map(b=>staffCard(b,me)).join('')}`:'';
  return `<div class="view">
   <div class="datebar"><button class="nb" data-act="sshift" data-v="-1">${I.chevL}</button><div class="dt">${fdate(d)}<small>${WDF[pd(d).getDay()]}</small></div><button class="nb" data-act="sshift" data-v="1">${I.chevR}</button></div>
   ${d!==iso(new Date())?`<button class="btn ghost small block" style="margin-bottom:6px" data-act="stoday">Сегодня</button>`:''}
   <div class="metrics"><div class="metric"><span>Ожидают</span><b>${c.length}</b></div><div class="metric acc"><span>В работе</span><b>${w.length}</b></div><div class="metric"><span>Закрыто</span><b>${dn.length}</b></div></div>
   <p class="hint" style="margin:-4px 2px 12px">Боксы: в работе ${w.length} из ${Math.max(1,+S.settings.boxes||1)}</p>
   <button class="btn block" data-act="book" data-admin="1">${I.plus} Новая запись</button>
   ${grp('В работе',w)}${grp('Ожидают',c)}${grp('Выполнено',dn)}
   ${list.length?'':`<div class="empty"><div class="ic">${I.cal}</div>На этот день заказов нет</div>`}</div>`;
}
function staffEditHtml(){
  const com=S.staff.find(x=>x.common),oth=S.staff.filter(x=>!x.common);
  const row=(x,del)=>`<div class="edit"><input data-stf="${x.id}" data-f="name" value="${esc(x.name)}" placeholder="Имя"><input data-stf="${x.id}" data-f="pin" value="${esc(x.pin)}" placeholder="PIN, 4–8 цифр" inputmode="numeric">${del?`<button class="btn danger small" style="margin-top:2px" data-act="stf-del" data-id="${x.id}">Удалить</button>`:''}</div>`;
  return `<p class="hint" style="margin:0 0 4px;line-height:1.5">Общий вход подходит всем сотрудникам: один PIN на всех. Личные аккаунты нужны только чтобы видеть, кто именно закрыл заказ. Сотрудники не видят выручку и настройки.</p>`
  +(com?`<label class="f">Общий вход для всех сотрудников</label>${row(com,false)}`:'')
  +`<label class="f">Личные аккаунты (необязательно)</label>`
  +oth.map(x=>row(x,true)).join('')
  +`<button class="btn ghost block" data-act="stf-add">${I.plus} Добавить сотрудника</button>`;
}
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.stf)return;
  const m=S.staff.find(x=>x.id===t.dataset.stf);if(!m)return;
  const f=t.dataset.f,v=t.value.trim();
  if(f==='pin'&&!/^\d{4,8}$/.test(v)){toast('PIN: от 4 до 8 цифр');t.value=m.pin;return}
  if(f==='name'&&!v){toast('Введите имя');t.value=m.name;return}
  m[f]=v;save();render();
});

/* ============ TELEGRAM BOT ============ */
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
async function tgApi(token,method,body){
  if(!/^\d+:[\w-]{20,}$/.test(token))throw new Error('Неверный формат токена');
  const r=await fetch('https://api.telegram.org/bot'+token+'/'+method,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json();if(!j.ok)throw new Error(j.description||'Ошибка Telegram');return j.result;
}
async function tgSend(text){
  const t=S.tg;if(!t||!t.on||!t.token||!t.chat)return;
  try{await tgApi(t.token,'sendMessage',{chat_id:t.chat,text,parse_mode:'HTML',disable_web_page_preview:true})}
  catch(e){toast('Telegram: не удалось отправить ('+e.message+')')}
}
function tgBookingText(b,adm){
  return `🆕 <b>Новая запись</b>${adm?' (добавлена админом)':''}\n\n🔧 ${esc(b.sname)}\n📅 ${fdateL(b.date)}, ${b.time}–${mt(tm(b.time)+b.dur)}\n🚗 ${esc(b.car)}${b.plate?' · '+esc(b.plate):''}\n👤 ${esc(b.name)}\n📞 ${esc(b.phone)}\n💰 ${rub(b.price)}`;
}
function tgCancelText(b){return `❌ <b>Запись отменена клиентом</b>\n\n🔧 ${esc(b.sname)}\n📅 ${fdateL(b.date)}, ${b.time}\n👤 ${esc(b.name)} · ${esc(b.phone)}`}
function tgHtml(){
  const t=S.tg;
  return `<p class="hint" style="margin:0 0 6px;line-height:1.55"><b style="color:var(--text)">Как подключить:</b><br>1. В Telegram откройте <b>@BotFather</b>, отправьте <b>/newbot</b> и скопируйте токен.<br>2. Напишите своему боту любое сообщение (или добавьте бота в группу и напишите там).<br>3. Нажмите «Найти Chat ID» — он подставится сам.<br>4. Нажмите «Отправить тест» и сохраните.</p>
  <label class="f">Токен бота</label><input id="tg1" value="${esc(t.token)}" placeholder="123456789:AA..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="f">Chat ID</label><input id="tg2" value="${esc(t.chat)}" placeholder="например 123456789 или -100..." autocomplete="off">
  <button class="btn ghost block small" style="margin-top:8px" data-act="tg-find">Найти Chat ID</button>
  <label class="opt" style="margin-top:14px;cursor:pointer"><input type="checkbox" id="tg3" style="width:22px;height:22px;flex:none" ${t.on?'checked':''}><span class="n">Отправлять новые заявки в Telegram</span></label>
  <div class="grid2" style="margin-top:6px"><button class="btn ghost" data-act="tg-test">Отправить тест</button><button class="btn" data-act="tg-save">Сохранить</button></div>
  <p class="hint">Токен хранится в браузере этого устройства. Используйте отдельного бота только для заявок и не передавайте файл с сохранёнными данными посторонним.</p>`;
}
function tgSaveFields(){const e=document.getElementById('tg3');S.tg={token:val('tg1'),chat:val('tg2'),on:!!(e&&e.checked)};save()}
async function tgFindChat(){
  const token=val('tg1');
  try{
    const up=await tgApi(token,'getUpdates',{limit:30});
    const chats=up.map(u=>(u.message||u.edited_message||u.channel_post||u.my_chat_member||{}).chat).filter(Boolean);
    if(!chats.length)return toast('Напишите боту сообщение и повторите');
    const c=chats[chats.length-1];document.getElementById('tg2').value=c.id;
    toast('Найден чат: '+(c.title||c.first_name||c.username||c.id));
  }catch(e){toast('Ошибка: '+e.message)}
}
async function tgTest(){
  tgSaveFields();
  try{await tgApi(S.tg.token,'sendMessage',{chat_id:S.tg.chat,text:'✅ <b>SGX Detailing</b>\nБот подключён, заявки будут приходить сюда.',parse_mode:'HTML'});toast('Тестовое сообщение отправлено')}
  catch(e){toast('Ошибка: '+e.message)}
}

/* ============ CUSTOM COLOUR ============ */
function themeHtml(){
  const cc=S.customColor||'#14b8a6';
  return `<div class="swatches">${THEMES.map(t=>`<button class="sw ${S.theme===t.id?'on':''}" style="--sc:${t.c2}" data-act="theme" data-v="${t.id}"><i></i><span>${t.name}</span>${S.theme===t.id?'✓':''}</button>`).join('')}
  <div class="sw ${S.theme==='custom'?'on':''}" id="cust" style="--sc:${cc}"><i data-act="theme" data-v="custom"></i><span data-act="theme" data-v="custom">Свой цвет<small id="chexl" style="display:block;color:var(--muted);font-weight:400;font-size:12px">${cc.toUpperCase()}</small></span><input type="color" id="cc" value="${cc}" style="width:56px;height:42px;padding:2px;flex:none"></div></div>
  <label class="f">HEX-код своего цвета</label><input id="chx" value="${cc}" placeholder="#14b8a6" maxlength="7" autocapitalize="off">
  <p class="hint">Выберите любой оттенок палитрой или введите HEX-код. Цвет применяется сразу.</p>`;
}
function setCustom(v,final){
  S.theme='custom';S.customColor=v;applyTheme('custom',v);
  const d=document.getElementById('cust');if(d){d.classList.add('on');d.style.setProperty('--sc',v)}
  const h=document.getElementById('chexl');if(h)h.textContent=v.toUpperCase();
  document.querySelectorAll('.swatches .sw:not(#cust)').forEach(x=>x.classList.remove('on'));
  const cc=document.getElementById('cc'),cx=document.getElementById('chx');
  if(cc&&cc.value!==v)cc.value=v;if(cx&&document.activeElement!==cx)cx.value=v;
  if(final){save();render()}
}
document.addEventListener('input',e=>{if(e.target.id==='cc')setCustom(e.target.value,false)});
document.addEventListener('change',e=>{
  if(e.target.id==='cc')setCustom(e.target.value,true);
  if(e.target.id==='chx'){let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v))setCustom(v.toLowerCase(),true);else toast('Введите HEX вида #14b8a6')}
});

/* ============ LIVE SYNC (другие вкладки и обновление данных) ============ */
function syncNow(){
  if(document.getElementById('ov'))return;
  let raw;try{raw=localStorage.getItem(KEY)}catch(e){return}
  if(!raw||raw===LAST)return;
  LAST=raw;S=load();render();
}
window.addEventListener('storage',e=>{if(e.key===KEY)syncNow()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
window.addEventListener('focus',syncNow);
setInterval(syncNow,3000);

/* ============ EVENTS ============ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
  switch(a){
   case 'mode':if(v==='admin'&&!isAuth()){askPass();break}if(v==='staff'&&!curStaff()){askStaff();break}enterMode(v);break;
   case 'pass-login':{const val=document.getElementById('pw0').value;if(val===String(S.pass)){setStaff('');setAuth(true);UI.mode='admin';localStorage.setItem('sgx_mode','admin');closeSheet();window.scrollTo(0,0);render();toast('Добро пожаловать')}else{toast('Неверный пароль');document.getElementById('pw0').value='';document.getElementById('pw0').focus()}break}
   case 'pass-save':{const a=p1.value,b=p2.value,c=p3.value;if(a!==String(S.pass))return toast('Текущий пароль неверный');if(b.length<4)return toast('Новый пароль слишком короткий');if(b!==c)return toast('Пароли не совпадают');S.pass=b;save();closeSheet();toast('Пароль изменён');break}
   case 'stat-view':SU.view=v;sbody().innerHTML=statsHtml();break;
   case 'stat-shift':{const d=pd(SU.date);d.setDate(1);if(SU.view==='month')d.setMonth(d.getMonth()+ +v);else d.setFullYear(d.getFullYear()+ +v);SU.date=iso(d);sbody().innerHTML=statsHtml();break}
   case 'soc-add':collectContacts();S.socials.push({id:uid(),type:'instagram',value:''});save();sbody().innerHTML=contactsHtml();break;
   case 'soc-del':collectContacts();S.socials=S.socials.filter(s=>s.id!==id);save();sbody().innerHTML=contactsHtml();break;
   case 'tab':UI.tab=v;window.scrollTo(0,0);render();break;
   case 'book':openBooking(t.dataset.sid,!!t.dataset.admin);break;
   case 'close':closeSheet();break;
   case 'aview':UI.aView=v;render();break;
   case 'ashift':UI.aDate=addDays(UI.aDate,(UI.aView==='week'?7:1)*+v);render();break;
   case 'bsvc':BK.sid=id;BK.time='';rebook();break;
   case 'bdate':BK.date=v;BK.time='';rebook();break;
   case 'bslot':BK.time=v;document.getElementById('slots').innerHTML=slotsHtml();break;
   case 'bconfirm':confirmBooking();break;
   case 'cancel':if(await ask('Отменить запись?','Отменить')){const b=S.bookings.find(x=>x.id===id);if(b){b.status='cancelled';save();tgSend(tgCancelText(b));toast('Запись отменена');render()}}break;
   case 'bkopen':openBk(id);break;
   case 'bkst':{setStatus(id,v,{id:'admin',name:'Админ'});closeSheet();render();toast('Статус: '+ST[v]);break}
   case 'bkdel':if(await ask('Удалить запись безвозвратно?','Удалить')){S.bookings=S.bookings.filter(x=>x.id!==id);S.myIds=S.myIds.filter(x=>x!==id);save();closeSheet();render()}break;
   case 'cfg':cfg(v);break;
   case 'save-hours':{const o=document.getElementById('h1').value,c=document.getElementById('h2').value;if(tm(c)<=tm(o))return toast('Закрытие должно быть позже открытия');
     S.settings={open:o,close:c,slot:+document.getElementById('h3').value,boxes:Math.max(1,+document.getElementById('h4').value||1)};save();closeSheet();render();toast('Сохранено');break}
   case 'save-contacts':collectContacts();S.socials=S.socials.filter(s=>(s.value||'').trim());save();closeSheet();render();toast('Сохранено');break;
   case 'save-cards':S.content={title:k1.value,subtitle:k2.value,promoTitle:k3.value,promoText:k4.value};save();closeSheet();render();toast('Сохранено');break;
   case 'hero-up':{const d=await pickImg(1200);if(d){S.heroPhoto=d;save();render();cfg('hero');toast('Фото обновлено')}break}
   case 'hero-reset':S.heroPhoto='';save();render();cfg('hero');break;
   case 'logo-up':{logoKeep();const d=await pickImg(300);if(d){S.logoImg=d;save();render();cfg('logo')}break}
   case 'logo-reset':logoKeep();S.logoImg='';save();render();cfg('logo');break;
   case 'save-logo':logoKeep();save();closeSheet();render();toast('Сохранено');break;
   case 'work-add':{const d=await pickImg(900);if(d){S.works.push({id:uid(),src:d});save();sbody().innerHTML=worksHtml();render()}break}
   case 'work-del':S.works=S.works.filter(w=>w.id!==id);save();sbody().innerHTML=worksHtml();render();break;
   case 'theme':S.theme=v;save();render();cfg('theme');break;
   case 'tg-save':tgSaveFields();toast('Сохранено');break;
   case 'tg-find':tgFindChat();break;
   case 'tg-test':tgTest();break;
   case 'stf-pick':STP=id;sbody().innerHTML=loginHtml();break;
   case 'login':askLogin();break;
   case 'login-role':LR=v;sbody().innerHTML=loginHtml();{const i=sbody().querySelector('#pw0,#sp0');if(i)i.focus()}break;
   case 'stf-login':stfLogin();break;
   case 'stf-status':await stfStatus(id,v);break;
   case 'sshift':UI.sDate=addDays(UI.sDate,+v);render();break;
   case 'stoday':UI.sDate=iso(new Date());render();break;
   case 'stf-add':S.staff.push({id:uid(),name:'Сотрудник',pin:String(1000+Math.floor(Math.random()*9000))});save();sbody().innerHTML=staffEditHtml();break;
   case 'stf-del':if((S.staff.find(x=>x.id===id)||{}).common)break;if(await ask('Удалить сотрудника?','Удалить')){S.staff=S.staff.filter(x=>x.id!==id);save();sbody().innerHTML=staffEditHtml();render()}break;
   case 'box-inc':case 'box-dec':{const n=Math.min(20,Math.max(1,(+S.settings.boxes||1)+(a==='box-inc'?1:-1)));S.settings.boxes=n;save();sbody().innerHTML=boxesHtml();render();break}
   case 'svc-add':S.services.push({id:uid(),name:'Новая услуга',desc:'Описание услуги',price:3500,dur:60});save();sbody().innerHTML=svcEditHtml();render();break;
   case 'svc-del':if(await ask('Удалить услугу?','Удалить')){S.services=S.services.filter(s=>s.id!==id);save();sbody().innerHTML=svcEditHtml();render()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.sid)return;
  const s=svc(t.dataset.sid);if(!s)return;const f=t.dataset.f;
  s[f]=(f==='price'||f==='dur')?Math.max(0,+t.value||0):t.value;
  if(f==='dur'&&s.dur<15)s.dur=15;
  S.bookings.forEach(b=>{if(b.sid===s.id&&b.status==='confirmed'&&f==='name')b.sname=s.name});
  save();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ PWA ============ */
function setupPWA(){
  /* Service Worker (офлайн-режим и установка) работает только по HTTPS или на localhost */
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http'))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Доступно обновление — перезапустите приложение')});
    });
  }).catch(()=>{});
}

/* ============ INIT ============ */
render();
setupPWA();
